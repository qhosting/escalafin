; ============================================================
; extensions_condusef.conf — Dialplan CONDUSEF/REDECO para Escalafin
; ============================================================
; Requisitos de cobranza extrajudicial según CONDUSEF:
; 1. Solo se permite llamar entre 07:00 y 21:59 hrs (Art. 12 REDECO)
; 2. El primer contacto DEBE incluir Razón Social y desglose de deuda
; 3. PROHIBIDO llamar a referencias personales (tipo_contacto = referencia)
;
; Instalación:
;   1. Copiar a /etc/asterisk/extensions_condusef.conf
;   2. Añadir #include extensions_condusef.conf en extensions.conf
;   3. asterisk -rx "dialplan reload"
; ============================================================

; ── Contexto principal de marcación saliente CONDUSEF ─────────────────────────
[condusef-outbound]

; Entrada de llamada saliente de cobranza
; Variables de canal requeridas (pasadas desde la aplicación):
;   CONDUSEF_CLIENT_NAME     = Nombre completo del titular
;   CONDUSEF_CLIENT_ID       = ID del cliente en Escalafin
;   CONDUSEF_COMPANY_NAME    = Razón Social de la empresa
;   CONDUSEF_LOAN_NUMBER     = Número de préstamo
;   CONDUSEF_CAPITAL         = Monto de capital adeudado
;   CONDUSEF_INTEREST        = Monto de intereses adeudados
;   CONDUSEF_TOTAL_DEBT      = Total adeudado
;   CONDUSEF_PHONE           = Teléfono a marcar
;   ESCALAFIN_API_URL        = URL base del API de Escalafin
;   ESCALAFIN_API_TOKEN      = Token de autenticación

exten => _X.,1,NoOp(=== CONDUSEF OUTBOUND CALL GUARD ===)
 same => n,NoOp(Cliente: ${CONDUSEF_CLIENT_NAME} | Tel: ${CONDUSEF_PHONE})
 same => n,Set(CHANNEL(language)=es)

; ── VERIFICACIÓN 1: Horario CONDUSEF ─────────────────────────────────────────
; Obtener hora actual en zona horaria de México Central (UTC-6)
 same => n,Set(CALLHOUR=${STRFTIME(${EPOCH},America/Mexico_City,%H)})
 same => n,NoOp(Hora actual México: ${CALLHOUR})

; Verificar si estamos en horario permitido (07:00 – 21:59)
 same => n,GotoIf($[${CALLHOUR} >= 7 & ${CALLHOUR} <= 21]?check_reference:out_of_hours)

; Fuera de horario — rechazar la llamada
exten => _X.,n(out_of_hours),NoOp(BLOQUEADO: Fuera de horario CONDUSEF. Hora: ${CALLHOUR}:xx)
 same => n,Set(CONDUSEF_BLOCK_REASON=OUT_OF_HOURS)
 same => n,UserEvent(ConductsefBlock,Reason: OUT_OF_HOURS,Phone: ${CONDUSEF_PHONE},Hour: ${CALLHOUR})
 same => n,Hangup(21) ; CAUSE 21 = Call Rejected

; ── VERIFICACIÓN 2: Filtro de referencias personales ─────────────────────────
exten => _X.,n(check_reference),NoOp(Verificando si el número es referencia personal...)
; Llamar al AGI script que consulta la API de Escalafin
 same => n,AGI(agi-condusef-check.js,${CONDUSEF_PHONE},${ESCALAFIN_API_URL},${ESCALAFIN_API_TOKEN},${CONDUSEF_CLIENT_ID})

; El AGI script establece CONDUSEF_IS_REFERENCE = "YES" o "NO"
 same => n,GotoIf($["${CONDUSEF_IS_REFERENCE}" = "YES"]?reference_blocked:proceed_call)

; Teléfono de referencia — PROHIBIDO llamar
exten => _X.,n(reference_blocked),NoOp(BLOQUEADO: Número de referencia personal. CONDUSEF prohibido.)
 same => n,Set(CONDUSEF_BLOCK_REASON=PERSONAL_REFERENCE)
 same => n,UserEvent(ConductsefBlock,Reason: PERSONAL_REFERENCE,Phone: ${CONDUSEF_PHONE})
 same => n,Hangup(21)

; ── LLAMADA PERMITIDA ─────────────────────────────────────────────────────────
exten => _X.,n(proceed_call),NoOp(Llamada PERMITIDA por CONDUSEF. Procediendo...)

; Registrar el intento de llamada
 same => n,UserEvent(ConductsefAllowed,Phone: ${CONDUSEF_PHONE},Client: ${CONDUSEF_CLIENT_ID},Hour: ${CALLHOUR})

; Preparar variables para el IVR de primer contacto
; Requerimiento CONDUSEF: el primer mensaje DEBE incluir Razón Social y desglose
 same => n,Set(CONDUSEF_INTRO_MSG=Buenos días. Le llama ${CONDUSEF_COMPANY_NAME} en relación al préstamo número ${CONDUSEF_LOAN_NUMBER}. El saldo de capital es de ${CONDUSEF_CAPITAL} pesos y el de intereses es de ${CONDUSEF_INTEREST} pesos, para un total de ${CONDUSEF_TOTAL_DEBT} pesos.)

; Marcar usando el proveedor SIP configurado
; Ajustar 'SIP/trunk_saliente' según la configuración local del PBX
 same => n,Dial(SIP/trunk_saliente/${CONDUSEF_PHONE},60,rL(${CONDUSEF_MAX_CALL_SECS:300}000))
 same => n,Set(DIAL_STATUS=${DIALSTATUS})
 same => n,NoOp(Estado de la llamada: ${DIAL_STATUS})

; Registrar resultado
 same => n,UserEvent(ConductsefCallResult,Status: ${DIAL_STATUS},Phone: ${CONDUSEF_PHONE},Client: ${CONDUSEF_CLIENT_ID})
 same => n,Hangup()


; ── Contexto IVR de primer contacto (para llamadas atendidas) ─────────────────
[condusef-first-contact-ivr]

; Reproducir mensaje de identificación requerido por CONDUSEF
exten => s,1,NoOp(IVR primer contacto CONDUSEF)
 same => n,Answer()
 same => n,Wait(1)
; Usar Text-to-Speech o grabación pre-grabada con la identificación completa
; Opción A: Grabación pre-grabada (recomendado para producción)
; same => n,Playback(condusef/identificacion_empresa)
; Opción B: Festival TTS (requiere configuración adicional)
 same => n,Festival(${CONDUSEF_INTRO_MSG})
 same => n,Wait(1)
; Continuar con el IVR de cobranza normal
 same => n,Goto(collections-ivr,s,1)
 same => n,Hangup()


; ── Manejo de eventos (para logging en Escalafin) ────────────────────────────
[condusef-events]

; UserEvents generados por el dialplan son capturados por el AMI listener
; del API de Escalafin para registrarlos en audit_logs.
; No requiere extensiones aquí — solo documentación.

; Eventos emitidos:
; - ConductsefBlock: llamada bloqueada (fuera de horario o referencia)
; - ConductsefAllowed: llamada permitida
; - ConductsefCallResult: resultado final de la llamada
